[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-foundation-bearing-capacity"
version = "0.1.0"
description = "Deep foundation bearing capacity."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Zhiyan Jiang", email = "zyjiang@alumni.iastate.edu"}]
keywords = ["geotechnical", "deep foundation", "bearing capacity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.9",
    "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]
notebooks = ["pyyaml>=6.0",  "jupyter"]

[project.urls]
Homepage = "https://github.com/Drzyjiang/Deep_Foundation_Bearing_Capacity"
Issues = "https://github.com/Drzyjiang/Deep_Foundation_Bearing_Capacity/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.setuptools.package-data]
"deep_foundation_bearing_capacity" = ["segments/cohesive_igm/*.csv"]